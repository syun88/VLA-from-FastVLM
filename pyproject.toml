[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-fastvlm"
version = "0.2.0a0"
description = "MLX-native Vision-Language-Action research on Apple's FastVLM for robot manipulation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Syun Robotics Lab" }
]
keywords = ["robotics", "vision-language-action", "fastvlm", "mlx", "lerobot", "metaworld"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=1.33",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.9",
    "mlx>=0.31.1",
    "mlx-lm>=0.31.2",
    "mlx-vlm>=0.4.4",
    "numpy",
    "pillow",
    "pyarrow>=16",
    "pyyaml",
    "tyro",
    "scipy>=1.12",
    "wandb>=0.24",
]

[project.optional-dependencies]
sim = [
    "gymnasium>=1.0",
    "metaworld>=3.0.0",
    "mujoco>=3.2",
]
dev = [
    "ruff",
    "pytest",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203", "E501"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
