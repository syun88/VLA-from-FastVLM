name: CI

on:
  push:
    branches: ["main", "research/mlx-fastvla"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Apple Silicon Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install MLX research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel
          python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check src scripts tests

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m pytest

      - name: Build package artifacts
        run: python -m build --sdist --wheel --no-isolation
