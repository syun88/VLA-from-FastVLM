name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install lightweight CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest ruff wheel
          python -m pip install -e . --no-deps

      - name: Syntax and import-safety lint
        run: python -m ruff check src scripts tests --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m pytest

      - name: Build package artifacts
        run: python -m build --sdist --wheel --no-isolation
